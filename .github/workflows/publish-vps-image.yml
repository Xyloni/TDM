name: Publish VPS image

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master, main]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-vps-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    # workflow_run has a write-capable token, so only publish successful CI
    # runs from this repository's own default branches, never PR code from a fork.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/grubdrops" >> "$GITHUB_OUTPUT"

      - name: Build and publish latest miner image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.miner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha,scope=vps-miner
          cache-to: type=gha,mode=max,scope=vps-miner

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      GRUB_DOMAIN: ${GRUB_DOMAIN:?Set GRUB_DOMAIN in vps/.env}
    depends_on:
      - miner
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
